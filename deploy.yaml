import:
  - deploy/env.php
  - recipe/laravel.php
  - deploy/deploy.php
  - contrib/npm.php
  - contrib/discord.php

config:
  application: 'aiku'
  default_selector: 'env=prod'
  repository: 'https://github.com/Inikoo-Ltd/aiku.git'

hosts:
  aiku:
    environment: 'production'
    deploy_path: '~/aiku'
    branch: production
    ssr_check_host: www.awgifts.sk
    labels:
      env: prod
  aiku_litio:
    hostname: 65.109.156.59
    remote_user: aiku
    ssh_arguments:
      - '-o ServerAliveInterval=30'
      - '-o ServerAliveCountMax=20'
      - '-o UserKnownHostsFile=deploy/known_hosts_litio'
      - '-o StrictHostKeyChecking=yes'
    environment: 'production'
    deploy_path: '~/aiku'
    branch: production
    octane_replica_state_file: logs/litio-replica-octane-server-state.json
    ssr_check_host: www.awgifts.sk
    labels:
      env: prod
  staging:
    environment: 'staging'
    deploy_path: '~/aiku'
    branch: staging
    keep_releases: 3
    labels:
      env: staging
  helio:
    hostname: 65.109.156.41
    remote_user: staging
    ssh_arguments:
      - '-o UserKnownHostsFile=deploy/known_hosts_helio'
      - '-o StrictHostKeyChecking=yes'
    environment: 'staging'
    deploy_path: '~/aiku'
    branch: staging
    keep_releases: 3
    labels:
      env: staging
tasks:
  build:
    - run: uptime
before:
  deploy: install:env
after:
  deploy:failed: [ deploy:unlock ]
  deploy:update_code: [ npm:my_install ]

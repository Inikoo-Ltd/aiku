  <g class="h" font-size="24">
    <text x="130" y="146">search products</text>
    <text x="102" y="200">Departments</text><text x="272" y="200">Collections</text>
    <text x="560" y="200" font-size="20">2,297 products</text>
    <text x="126" y="320">🌿</text><text x="486" y="320">🧴</text>
    <text x="120" y="454">department a</text><text x="480" y="454">department b</text>
    <text x="126" y="500">🕯</text><text x="486" y="500">🧼</text>
    <text x="120" y="634">department c</text><text x="480" y="634">department d</text>

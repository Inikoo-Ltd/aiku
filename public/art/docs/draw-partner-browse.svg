    <path d="M600 578 a13 13 0 1 0 26 0 a13 13 0 1 0 -26 0 M613 571 l0 14 M606 578 l14 0"/>
    <path d="M826 206 C930 198 1060 206 1124 202 C1136 380 1134 500 1124 596 C1020 606 900 604 834 596 C822 470 820 290 826 206 Z"/>

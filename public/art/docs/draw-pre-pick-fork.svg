  <g class="h" font-size="24">
    <text x="60" y="86" font-size="30">Factory › Pre-pick</text>
    <text x="66" y="358" font-size="19">shopping list</text>
    <text x="72" y="425" font-size="21">SKU-01</text><text x="178" y="425" font-size="21">96</text>
    <text x="322" y="332">To produce</text>
    <text x="322" y="414">Pre-pick</text>
    <text x="770" y="298">All in stock</text>
    <text x="828" y="348" font-size="22">≤ 10 min</text>
    <text x="1014" y="276" font-size="19">partner's bay</text>
    <text x="770" y="412">Part in stock</text>
    <text x="770" y="604">Won't come</text>
    <text x="1026" y="631" font-size="30" text-anchor="middle" transform="rotate(-7 1026 620)" style="fill:#b53a2a">Close short</text>
  </g>
  <g class="hl" font-size="21">
    <text x="52" y="286">a partner's line</text>
    <text x="52" y="310">arrives</text>
    <text x="830" y="150">none in stock: it gets made</text>
    <text x="500" y="626">some or all in stock</text>
    <text x="828" y="376">goes on its own</text>
    <text x="880" y="474">more coming</text>
    <text x="300" y="732">the partner is told</text>
  </g>
  <g class="h" font-size="19" opacity=".7"><text x="850" y="736">— where a partner's line goes</text></g>

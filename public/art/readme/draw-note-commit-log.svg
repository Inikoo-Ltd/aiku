<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="1200" height="700" font-family="'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive">
  <defs>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="720" height="420" rx="8" fill="#F2ECDD" filter="url(#paper)"/>

  <!-- notebook page -->
  <g transform="rotate(-1 360 210)">
    <rect x="70" y="34" width="420" height="356" fill="#FAF6EA" stroke="#4A4238" stroke-width="1.4" filter="url(#wash)"/>
    <path d="M100 34 l0 356" stroke="#B0483E" stroke-width="1" opacity=".5" filter="url(#pencil)"/>
    <g font-size="19" fill="#4A4238" filter="url(#pencil)">
      <text x="112" y="76">2008  "Initial import"</text>
      <text x="112" y="108">2009  "pies almost done but other gres broken"</text>
      <text x="112" y="140">2010  "KAKTUS-304: RESOLVED"  <tspan font-size="14" fill="#6B6355">(24 Dec)</tspan></text>
      <text x="112" y="172">2017  "Stock Levels don't add up..we think"</text>
      <text x="112" y="204">2019  "fix searches" "fixing searh" "fic not</text>
      <text x="130" y="228">displaying shippers"  <tspan font-size="14" fill="#6B6355">(1 Jan, all day)</tspan></text>
      <text x="112" y="260">2020  "leap year hack"  "trains in aikus"</text>
      <text x="112" y="292" fill="#8A3B37">2021  "brexit nightmare"</text>
      <text x="112" y="324">2024  "producton seaarch f*** yea"</text>
      <text x="112" y="356" fill="#3E6E72">2026  still committing</text>
    </g>
  </g>

  <!-- coffee ring -->
  <g filter="url(#wash)" opacity=".45">
    <circle cx="420" cy="120" r="42" fill="none" stroke="#8A6B4A" stroke-width="7"/>
    <circle cx="424" cy="118" r="36" fill="none" stroke="#8A6B4A" stroke-width="3"/>
  </g>

  <!-- clock at 3am -->
  <g transform="translate(590,90)" filter="url(#pencil)">
    <circle r="46" fill="#FAF6EA" stroke="#4A4238" stroke-width="1.6"/>
    <circle r="2.5" fill="#4A4238"/>
    <path d="M0 0 L30 2" stroke="#4A4238" stroke-width="2.5"/>
    <path d="M0 0 L0 -32" stroke="#4A4238" stroke-width="1.8"/>
    <text x="-6" y="-52" font-size="16" fill="#6B6355">3 am</text>
  </g>
  <text x="540" y="196" font-size="16" fill="#6B6355" filter="url(#pencil)">135 commits</text>
  <text x="540" y="216" font-size="16" fill="#6B6355" filter="url(#pencil)">at this hour</text>

  <!-- moon doodle -->
  <g transform="translate(614,290)" filter="url(#pencil)">
    <circle r="24" fill="none" stroke="#4A4238" stroke-width="1.4"/>
    <path d="M-6 -20 a24 24 0 1 0 6 44 a19 19 0 1 1 -6 -44" fill="#C9A46B" opacity=".6"/>
  </g>
  <text x="548" y="356" font-size="17" fill="#6B6355" filter="url(#pencil)">18 years of log</text>
</svg>

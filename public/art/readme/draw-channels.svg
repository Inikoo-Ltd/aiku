  </g>
  <g class="pen">
    <path d="M80 90 C260 82 460 94 520 88 C526 230 524 400 520 520 C380 528 200 524 84 526 C78 400 80 220 80 90 Z"/>
    <path d="M80 130 C260 124 440 134 520 128" class="soft"/>
    <circle cx="104" cy="110" r="5" class="soft"/><circle cx="122" cy="110" r="5" class="soft"/><circle cx="140" cy="110" r="5" class="soft"/>
    <path d="M180 104 C300 100 420 106 480 102 C482 112 482 116 480 118 C420 120 300 118 180 118 Z" class="soft"/>

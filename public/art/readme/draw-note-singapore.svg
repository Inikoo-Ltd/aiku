<svg viewBox="0 0 720 420" width="1200" height="700" font-family="'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive" role="img" aria-label="Watercolor and pencil illustration: a man with a laptop at a night hawker stall in Southeast Asia" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
          <feGaussianBlur stdDeviation="0.7"/>
        </filter>
        <filter id="wash2" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="21" result="n"/>

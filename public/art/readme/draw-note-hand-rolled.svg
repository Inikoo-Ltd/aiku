<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="1200" height="700" font-family="'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive">
  <defs>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="720" height="420" rx="8" fill="#F2ECDD" filter="url(#paper)"/>

  <!-- pegboard -->
  <rect x="36" y="40" width="428" height="330" rx="8" fill="#E9DEC4" opacity=".7" filter="url(#wash)"/>
  <rect x="36" y="40" width="428" height="330" rx="8" fill="none" stroke="#4A4238" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="60" y="76" font-size="24" fill="#7A4A33" filter="url(#pencil)">the workshop, 2008-2022</text>

  <!-- hammer: router -->
  <g transform="translate(80,110) rotate(-6)" filter="url(#pencil)">
    <rect x="0" y="0" width="14" height="76" rx="4" fill="#C9A46B" stroke="#4A4238" stroke-width="1.3"/>
    <rect x="-18" y="-18" width="50" height="22" rx="5" fill="#8A8062" stroke="#4A4238" stroke-width="1.3"/>
  </g>
  <text x="66" y="226" font-size="18" fill="#6B6355" filter="url(#pencil)">the router</text>
  <text x="60" y="246" font-size="14" fill="#3E6E72" filter="url(#pencil)">5,864 lines</text>

  <!-- wrench: ORM -->
  <g transform="translate(210,104) rotate(8)" filter="url(#pencil)">
    <rect x="4" y="10" width="12" height="70" rx="5" fill="#8A8062" stroke="#4A4238" stroke-width="1.3"/>
    <circle cx="10" cy="6" r="14" fill="none" stroke="#4A4238" stroke-width="4"/>
  </g>
  <text x="196" y="226" font-size="18" fill="#6B6355" filter="url(#pencil)">the ORM</text>

  <!-- saw: templates -->
  <g transform="translate(330,112) rotate(-4)" filter="url(#pencil)">
    <rect x="0" y="0" width="16" height="30" rx="5" fill="#C9A46B" stroke="#4A4238" stroke-width="1.3"/>
    <path d="M4 30 l10 0 6 60 -4 4 -4 -5 -4 5 -4 -5 -4 5 z" fill="#D8D2C2" stroke="#4A4238" stroke-width="1.2"/>
  </g>
  <text x="322" y="226" font-size="18" fill="#6B6355" filter="url(#pencil)">the views</text>

  <!-- fork: queue -->
  <g transform="translate(110,280) rotate(4)" filter="url(#pencil)">
    <rect x="6" y="18" width="10" height="52" rx="4" fill="#8A8062" stroke="#4A4238" stroke-width="1.2"/>
    <path d="M0 0 l0 20 M11 0 l0 20 M22 0 l0 20 M0 18 q11 10 22 0" fill="none" stroke="#4A4238" stroke-width="3"/>
  </g>
  <text x="90" y="366" font-size="18" fill="#6B6355" filter="url(#pencil)">the queue</text>

  <!-- flags: i18n -->
  <g transform="translate(280,272)" filter="url(#pencil)">
    <path d="M0 0 l0 70" stroke="#4A4238" stroke-width="2.5"/>
    <path d="M0 4 l34 8 -34 10 z" fill="#8A3B37" opacity=".7"/>
    <path d="M0 26 l30 7 -30 9 z" fill="#3E6E72" opacity=".7"/>
    <path d="M0 46 l26 6 -26 8 z" fill="#C9A46B" opacity=".8"/>
  </g>
  <text x="256" y="366" font-size="18" fill="#6B6355" filter="url(#pencil)">the i18n, 16 flags</text>

  <!-- boxed kit: laravel -->
  <g filter="url(#wash)">
    <rect x="502" y="196" width="180" height="130" rx="10" fill="#3E6E72" opacity=".4"/>
  </g>
  <g filter="url(#pencil)" stroke="#4A4238" fill="none">
    <rect x="502" y="196" width="180" height="130" rx="10" stroke-width="1.5"/>
    <path d="M502 240 l180 0" stroke-width="1.2"/>
    <path d="M560 196 l0 -18 70 0 0 18" stroke-width="1.4"/>
  </g>
  <text x="524" y="228" font-size="22" fill="#7A4A33" filter="url(#pencil)">framework in a box</text>
  <text x="524" y="276" font-size="18" fill="#3E6E72" filter="url(#pencil)">router &#183; ORM &#183; views</text>
  <text x="524" y="300" font-size="18" fill="#3E6E72" filter="url(#pencil)">queues &#183; i18n &#183; auth</text>
  <text x="500" y="366" font-size="17" fill="#6B6355" filter="url(#pencil)">2022: bought the box</text>

  <path d="M470 250 q14 -60 40 -66" fill="none" stroke="#6B6355" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" filter="url(#pencil)"/>
  <text x="452" y="150" font-size="18" fill="#6B6355" filter="url(#pencil)">14 years later&#8230;</text>
</svg>

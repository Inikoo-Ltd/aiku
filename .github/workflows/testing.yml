name: Backend Tests
on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "mobile/**" ]
  workflow_dispatch:

concurrency:
  group: backend_tests_${{ github.ref }}
  cancel-in-progress: false

env:
  HOME: /home/aiku_test
  REDIS_SOCKET: /home/aiku_test/redis-ci.sock
  REDIS_DEFAULT_HOST: /home/aiku_test/redis-ci.sock
  REDIS_HORIZON_HOST: /home/aiku_test/redis-ci.sock
  REDIS_CACHE_HOST: /home/aiku_test/redis-ci.sock
  REDIS_SESSIONS_HOST: /home/aiku_test/redis-ci.sock
  REDIS_DEFAULT_PORT: 0
  REDIS_HORIZON_PORT: 0
  REDIS_CACHE_PORT: 0
  REDIS_SESSONS_PORT: 0

jobs:
  laravel-tests:
    name: Run backend tests 🧪
    runs-on: [ helio ]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # full history: DevopsTest resolves HEAD~2 to diff deployments
          fetch-depth: 0
      - name: Composer install
        run: php8.4 /usr/local/bin/composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          ln -s ../../../../.pgpass .pgpass
          ln -s ../../../../env.aiku.testing .env.testing
          ln -s ../../../../env.aiku.testing .env
          ln -s ../../../../../artifacts/playwright/node_modules node_modules
          ln -s ../../../../../artifacts/oauth/oauth-private.key storage/oauth-private.key
          ln -s ../../../../../artifacts/oauth/oauth-public.key storage/oauth-public.key
          ln -s ../../../../../artifacts/public/grp public/grp
          ln -s ../../../../../artifacts/public/iris public/iris
          ln -s ../../../../../artifacts/public/retina public/retina
          ln -s ../../../../../artifacts/public/aiku-public public/aiku-public
          mkdir private
          cd private
          ln -s ../../../../../artifacts/fa .
      - name: Generate database dumps 📚
        run: |
          MIGRATIONS_HASH=$(git ls-files -s database/migrations database/seeders | git hash-object --stdin)
          if [ ! -f ../../../../artifacts/aiku.dump ] || [ "$MIGRATIONS_HASH" != "$(cat ../../../../artifacts/aiku.dump.migrations_hash 2>/dev/null)" ]; then
            DB_HOST=$(sed -n 's/^DB_HOST=//p' .env.testing)
            DB_PORT=$(sed -n 's/^DB_PORT=//p' .env.testing)
            ./generate_testing_db_dumps.sh php8.4 aiku_test "${DB_HOST:-localhost}" "${DB_PORT:-5432}"
            cp tests/datasets/db_dumps/aiku.dump ../../../../artifacts/aiku.dump.tmp
            mv ../../../../artifacts/aiku.dump.tmp ../../../../artifacts/aiku.dump
            echo "$MIGRATIONS_HASH" > ../../../../artifacts/aiku.dump.migrations_hash
          else
            echo "Migrations unchanged, reusing cached aiku.dump"
          fi
      - name: Retrieve db dumps
        run: cp ../../../../artifacts/aiku.dump tests/datasets/db_dumps/
      - name: Start private Redis
        run: redis-server --port 0 --unixsocket "$REDIS_SOCKET" --unixsocketperm 700 --save '' --appendonly no --maxmemory 512mb --daemonize yes --pidfile /home/aiku_test/redis-ci.pid --logfile /home/aiku_test/redis-ci.log
      - name: Order test files slowest first
        run: /usr/bin/php8.4 devops/ci/order-tests-slowest-first.php ../../../../artifacts/last-junit.xml
      - name: Run test without coverage
        run: /usr/bin/php8.4 -dxdebug.mode=off vendor/bin/pest --configuration=phpunit.ci.xml --parallel --processes=${PEST_PROCESSES:-6} --log-junit junit.xml
      - name: Keep test durations for the next run
        if: ${{ !cancelled() }}
        run: |
          if [ -s junit.xml ]; then
            cp junit.xml ../../../../artifacts/last-junit.xml.tmp
            mv ../../../../artifacts/last-junit.xml.tmp ../../../../artifacts/last-junit.xml
          fi
      - name: Report test results to aiku
        if: ${{ !cancelled() }}
        env:
          DEVOPS_TOKEN: ${{ secrets.DEVOPS_TOKEN }}
        run: /usr/bin/php8.4 devops/ci/report-test-results.php junit.xml
      - name: Editorial translation audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if ! /usr/bin/php8.4 -dxdebug.mode=off vendor/bin/pest tests/Feature/AikuPublicTest.php --group=editorial; then
            echo "::warning::Documentation translations are missing or stale; see the editorial audit output."
            echo "Documentation translations need attention. See the Editorial translation audit step for missing or stale guides." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Flake check, changed test files run twice 🎲
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          CHANGED=$(git diff --name-only "$BEFORE" HEAD -- 'tests/Feature' 'tests/Unit' | grep 'Test\.php$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed test files, skipping"
            exit 0
          fi
          FILES=""
          for FILE in $CHANGED; do
            if [ -f "$FILE" ]; then
              FILES="$FILES $FILE"
            else
              echo "$FILE was deleted, skipping"
            fi
          done
          if [ -z "$FILES" ]; then
            echo "Only deleted test files, skipping"
            exit 0
          fi
          /usr/bin/php8.4 devops/ci/order-tests-slowest-first.php ../../../../artifacts/last-junit.xml $FILES
          for RUN in 1 2; do
            echo "::group::Changed test files run $RUN:$FILES"
            /usr/bin/php8.4 -dxdebug.mode=off vendor/bin/pest --configuration=phpunit.ci.xml --parallel --processes=${PEST_PROCESSES:-6}
            echo "::endgroup::"
          done
      - name: Stop private Redis
        if: ${{ always() }}
        run: redis-cli -s "$REDIS_SOCKET" shutdown nosave || true

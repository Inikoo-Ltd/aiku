name: Deploy Aiku

on:
  push:
    branches: [ "production" ]

concurrency: production_deployment

permissions:
  contents: write

jobs:
  deployment:
    name: Deploy aiku 🚀
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Unmask secret
        run: echo "${{ secrets.DEPLOY_SSH_CONFIG }}" | base64
      - name: Unmask secret
        run: echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" | base64
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Composer install
        run: php8.4 /usr/local/bin/composer update --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Get Next Version
        id: semver
        run: |
          set -euo pipefail

          # Highest semver tag, never merely the nearest: a stray non-semver tag
          # must not drag the version backwards
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -z "$latest" ]; then
            echo "No semver tag found, starting from v0.0.0"
            latest=v0.0.0
            range=HEAD
          else
            range="$latest..HEAD"
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          subjects=$(git log --no-merges --format=%s $range || true)

          # Both conventions in this repo mark a feature: a sparkle subject, and a
          # feat:/enhance: prefix. Either takes the minor, everything else is a patch
          if printf '%s\n' "$subjects" | grep -qiE '^(✨|(feat|features?|enhance|enhancements?)(\(.+\))?!?:)'; then
            next="v${major}.$((minor + 1)).0"
            reason="feature commit since $latest"
          else
            next="v${major}.${minor}.$((patch + 1))"
            reason="no feature commit since $latest"
          fi

          # next names the git tag; release is what Sentry sees, carrying the sha so a
          # release stays unique to its commit even if the tag step fails
          echo "Next version $next ($reason)"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "release=$next+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set .env
        run: |
          touch .env.aiku.production.deploy
          echo RELEASE=${{ steps.semver.outputs.release }} >> .env.aiku.production.deploy
      - name: Authenticate server git fetches with the job token
        run: |
          auth=$(printf 'x-access-token:%s' "${{ github.token }}" | base64 -w0)
          echo "::add-mask::$auth"
          echo "GIT_HTTP_AUTH=$auth" >> "$GITHUB_ENV"
      - name: Launch 🚀
        uses: deployphp/action@v1
        with:
          dep: deploy
          ssh-config: ${{ secrets.DEPLOY_SSH_CONFIG_V2 }}
          private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS_V2 }}
          verbosity: -vvv
          deployer-version: '8.0.0'
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ steps.semver.outputs.next }}
          commit: 'production'
          tag: ${{ steps.semver.outputs.next }}
          token: ${{ github.token }}
#      - name: New Relic Application Deployment Marker
#        uses: newrelic/deployment-marker-action@v2.3.0
#        with:
#          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
#          guid: ${{ secrets.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
#          version: ${{ steps.semver.outputs.next }}
#          user: "${{ github.actor }}"
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: 'inikoo-ltd'
        with:
          ignore_missing: true
          environment: production
          set_commits: 'skip'
          projects: 'aiku'
          release: ${{ steps.semver.outputs.release }}

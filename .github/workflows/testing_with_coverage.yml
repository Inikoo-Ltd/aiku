name: Nightly Coverage & Bundle Analysis
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Run only this job
        type: choice
        default: all
        options: [ all, coverage, bundle ]

env:
  HOME: /home/aiku_test
  REDIS_SOCKET: /home/aiku_test/redis-ci.sock
  REDIS_DEFAULT_HOST: /home/aiku_test/redis-ci.sock
  REDIS_HORIZON_HOST: /home/aiku_test/redis-ci.sock
  REDIS_CACHE_HOST: /home/aiku_test/redis-ci.sock
  REDIS_SESSIONS_HOST: /home/aiku_test/redis-ci.sock
  REDIS_DEFAULT_PORT: 0
  REDIS_HORIZON_PORT: 0
  REDIS_CACHE_PORT: 0
  REDIS_SESSONS_PORT: 0
  XDEBUG_MODE: 'off'

jobs:
  coverage:
    name: Coverage → Codecov 📊
    if: ${{ inputs.only == 'all' || inputs.only == 'coverage' || inputs.only == '' }}
    runs-on: [ helio ]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Composer install
        run: php8.4 /usr/local/bin/composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          ln -s ../../../../.pgpass .pgpass
          ln -s ../../../../env.aiku.testing .env.testing
          ln -s ../../../../env.aiku.testing .env
          ln -s ../../../../../artifacts/playwright/node_modules node_modules
          ln -s ../../../../../artifacts/oauth/oauth-private.key storage/oauth-private.key
          ln -s ../../../../../artifacts/oauth/oauth-public.key storage/oauth-public.key
          ln -s ../../../../../artifacts/public/grp public/grp
          ln -s ../../../../../artifacts/public/iris public/iris
          ln -s ../../../../../artifacts/public/retina public/retina
          ln -s ../../../../../artifacts/public/aiku-public public/aiku-public
          mkdir private
          cd private
          ln -s ../../../../../artifacts/fa .
      - name: Generate database dumps 📚
        run: |
          MIGRATIONS_HASH=$(git ls-files -s database/migrations database/seeders | git hash-object --stdin)
          if [ ! -f ../../../../artifacts/aiku.dump ] || [ "$MIGRATIONS_HASH" != "$(cat ../../../../artifacts/aiku.dump.migrations_hash 2>/dev/null)" ]; then
            DB_HOST=$(sed -n 's/^DB_HOST=//p' .env.testing)
            DB_PORT=$(sed -n 's/^DB_PORT=//p' .env.testing)
            ./generate_testing_db_dumps.sh php8.4 aiku_test "${DB_HOST:-localhost}" "${DB_PORT:-5432}"
            cp tests/datasets/db_dumps/aiku.dump ../../../../artifacts/aiku.dump.tmp
            mv ../../../../artifacts/aiku.dump.tmp ../../../../artifacts/aiku.dump
            echo "$MIGRATIONS_HASH" > ../../../../artifacts/aiku.dump.migrations_hash
          else
            echo "Migrations unchanged, reusing cached aiku.dump"
          fi
      - name: Retrieve db dumps
        run: cp ../../../../artifacts/aiku.dump tests/datasets/db_dumps/
      - name: Start private Redis
        run: redis-server --port 0 --unixsocket "$REDIS_SOCKET" --unixsocketperm 700 --save '' --appendonly no --maxmemory 512mb --daemonize yes --pidfile /home/aiku_test/redis-ci.pid --logfile /home/aiku_test/redis-ci.log
      - name: Run tests with coverage
        run: |
          COVERAGE=""
          mkdir -p "$RUNNER_TEMP/php-coverage"
          printf 'extension=pcov.so\npcov.enabled=1\npcov.directory=app\n' > "$RUNNER_TEMP/php-coverage/pcov.ini"
          export PHP_INI_SCAN_DIR=":$RUNNER_TEMP/php-coverage"
          if php8.4 -m | grep -qiE '^(pcov|xdebug)$'; then
            COVERAGE="--coverage-clover clover.xml"
          else
            echo "::warning::No coverage driver (pcov/xdebug) for php8.4 on this runner, running tests without coverage"
          fi
          sed 's/name="memory_limit" value="5120M"/name="memory_limit" value="-1"/' phpunit.xml > phpunit.coverage.xml
          /usr/bin/php8.4 -d memory_limit=-1 -d newrelic.enabled=0 vendor/bin/pest --configuration phpunit.coverage.xml --testsuite=Unit,Feature --parallel --processes=${PEST_PROCESSES:-4} $COVERAGE --log-junit junit.xml
      - name: Upload coverage to Codecov
        if: ${{ hashFiles('clover.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Inikoo-Ltd/aiku
          files: clover.xml
          flags: backend
          fail_ci_if_error: true
      - name: Editorial translation audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if ! /usr/bin/php8.4 -dxdebug.mode=off -d newrelic.enabled=0 vendor/bin/pest tests/Feature/AikuPublicTest.php --group=editorial; then
            echo "::warning::Documentation translations are missing or stale; see the editorial audit output."
            echo "Documentation translations need attention. See the Editorial translation audit step for missing or stale guides." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Inikoo-Ltd/aiku
          files: junit.xml
          flags: backend

      - name: Stop private Redis
        if: ${{ always() }}
        run: redis-cli -s "$REDIS_SOCKET" shutdown nosave || true

  bundle-analysis:
    name: Bundle analysis → Codecov 📦
    if: ${{ inputs.only == 'all' || inputs.only == 'bundle' || inputs.only == '' }}
    runs-on: [ helio ]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare environment
        run: |
          mkdir private
          cd private
          ln -s ../../../../../artifacts/fa .
      - name: npm ci
        run: npm ci
      - name: Build and upload bundle stats
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

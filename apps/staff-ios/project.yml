name: Aiku
options:
  bundleIdPrefix: com.inikoo
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.35.0
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Aiku:
    type: application
    platform: iOS
    sources:
      - Aiku
    dependencies:
      - package: Sentry
    info:
      path: Aiku/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aiku
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, bg, cs, de, es, fr, hi, hr, hu, id, it, ja, lv, ne, nl, pl, pt, ro, sk, sv, tr, uk, zh-Hans]
        AikuAPIBaseURL: $(API_BASE_URL)
        AikuMobileAppKey: $(AIKU_MOBILE_APP_KEY)
        AikuSentryDSN: $(AIKU_SENTRY_DSN)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Aiku uses the camera to scan clocking QR codes and barcodes.
        NSLocationWhenInUseUsageDescription: Aiku checks you are at your workplace when you clock in with a QR code.
        NSLocalNetworkUsageDescription: Aiku connects to your organisation's Aiku server on this network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIKU_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  AikuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AikuTests
    dependencies:
      - target: Aiku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIKU_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  AikuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AikuUITests
    dependencies:
      - target: Aiku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIKU_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Aiku
schemes:
  Aiku:
    build:
      targets:
        Aiku: all
    test:
      config: Debug
      targets:
        - AikuTests
        - AikuUITests
    run:
      config: Debug
    archive:
      config: Release

name: Aiku
options:
  bundleIdPrefix: com.inikoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Aiku:
    type: application
    platform: iOS
    sources:
      - Aiku
    info:
      path: Aiku/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aiku
        AikuAPIBaseURL: $(API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIKU_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  AikuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AikuTests
    dependencies:
      - target: Aiku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIKU_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  AikuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AikuUITests
    dependencies:
      - target: Aiku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIKU_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Aiku
schemes:
  Aiku:
    build:
      targets:
        Aiku: all
    test:
      config: Debug
      targets:
        - AikuTests
        - AikuUITests
    run:
      config: Debug
    archive:
      config: Release

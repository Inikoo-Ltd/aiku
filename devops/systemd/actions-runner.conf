[Service]
Restart=always
RestartSec=10
KillMode=mixed
# MemoryMax only, deliberately. MemoryHigh is a throttle, not a ceiling: the suite
# genuinely wants more than any figure worth setting, so the kernel just reclaims in a
# loop and the run crawls. 20G here cost 900k throttle events and 80% stall time, turning
# an 8 minute run into 30. The hard cap is what keeps CI from taking the box down.
MemoryMax=24G

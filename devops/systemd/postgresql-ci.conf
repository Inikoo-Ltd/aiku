# Drop-in for postgresql@18-ci: the throwaway test cluster. Data lives on tmpfs, runs as
# pgci (not postgres, which owns the production standby), and gives way to production.
[Unit]
Requires=ci-fence.service
After=ci-fence.service

[Service]
ExecStartPre=/usr/local/sbin/aiku-ci-postgres pre
ExecStartPost=/usr/local/sbin/aiku-ci-postgres post
PIDFile=/run/postgresql-ci/18-ci.pid
MemoryMax=8G
CPUWeight=20
IOWeight=10
OOMScoreAdjust=500

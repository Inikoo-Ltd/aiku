;etc/supervisor/conf.d/aiku-staging-inertia-ssr.conf
; Mirrors aiku-inertia-ssr.conf so staging exercises SSR the same way production
; does. Without it staging silently falls back to CSR and the deploy's SSR
; verification never runs, which is how helio served CSR unnoticed until
; 2026-07-13. The program name matches production because deploy.php looks up
; "inertia-ssr-production" by name.
[program:inertia-ssr-production]
process_name=%(program_name)s
command=/usr/bin/php8.4 /home/staging/aiku/anchor/octane/artisan inertia:start-ssr --runtime bun
autostart=true
autorestart=true
user=staging
redirect_stderr=true
stdout_logfile=/home/staging/logs/inertia_ssr.log
stopasgroup=true
killasgroup=true
stopwaitsecs=5

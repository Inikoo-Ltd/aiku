;etc/supervisor/aiku-owl.conf
[program:aiku-owl]
process_name=%(program_name)s
; The anchor is a stable path, never a release dir: a release rotates out from
; under a long-running daemon (keep_releases=25) and takes its cwd with it.
command=/usr/bin/php8.4 /home/aiku/aiku/anchor/octane/artisan nightowl:agent
directory=/home/aiku/aiku/anchor/octane
autostart=true
autorestart=true
user=aiku
redirect_stderr=true
stdout_logfile=/home/aiku/logs/owl.log
stopwaitsecs=3600
stopasgroup=true
killasgroup=true

# Throwaway CI test cluster on helio (18/ci, port 5433, owner pgci, data on tmpfs).
# Place at /etc/postgresql/18/ci/conf.d/99-ci.conf
listen_addresses = ''
port = 5433
unix_socket_directories = '/run/postgresql-ci'
external_pid_file = '/run/postgresql-ci/18-ci.pid'

fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
checkpoint_timeout = 30min
max_wal_size = 2GB

# 16 pest workers x a few connections each; one runner = one job at a time
max_connections = 150
# parallel runs over a many-thousand-table schema blow the default 64 (SQLSTATE 53200)
max_locks_per_transaction = 1024

shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 32MB
maintenance_work_mem = 512MB
random_page_cost = 1.1

timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'

# WAL tuning for boro (production primary, 187GB RAM, 32 cores, 1.8TB RAID).
# Applied live via ALTER SYSTEM on 13 Aug 2026 after the disk-full outage, so
# the running values live in postgresql.auto.conf — WHICH OVERRIDES THIS FILE.
# This copy exists so a server rebuild restores the tuning. After installing on
# a fresh cluster this file is authoritative; on the current cluster it is a
# record. Keep the two in sync when changing values.
# Place at /etc/postgresql/18/main/conf.d/99-boro-production.conf
#
# WHY (12 Aug 2026 outage): the stock max_wal_size=1GB forced a checkpoint
# every few seconds during bulk backfills. Every checkpoint restarts full-page
# writes, so the same pages were logged as 8KB images over and over — a WAC
# backfill generated ~374GB of WAL, the helio replication slot pinned it on
# disk, the disk hit 100% and postgres died. These three settings cut WAL
# volume roughly 3x for the same work; measured afterwards: a 28-worker
# backfill peaked at ~700MB/min WAL vs ~8,300MB/min during the outage.

# --- fewer checkpoints = drastically fewer full-page images ---
max_wal_size = 32GB
checkpoint_timeout = 30min

# --- compress the full-page images that remain (lz4: ~2-3x on 8KB pages) ---
wal_compression = lz4

# --- DELIBERATELY NOT SET: max_slot_wal_keep_size ---
# Bounding the slot protects boro's disk but INVALIDATES the helio replica if
# exceeded (full 489GB rebuild). Decision (Raul): set to ~600GB only after the
# email-retention purge + pg_repack shrink the DB. Until then lag is monitored
# instead. When setting it: ALTER SYSTEM SET max_slot_wal_keep_size='600GB';
# then update this file.

# --- WAL archiving to Cloudflare R2 with pgBackRest (INI-113, live 17 Oct 2026) ---
# Set with ALTER SYSTEM like the rest; archive_mode needs a restart.
# Setup and restore: devops/postgres/pgbackrest-aiku.conf.
# A restart of boro leaves helio's 12 h delayed replica disconnected for up to
# 12 hours: it replays the WAL it already holds before it asks for more, so it
# reconnects by itself once it reaches the restart point. Its slot keeps the
# WAL meanwhile, and MonitorDatabaseReplicas reports it as disconnected.
archive_mode = on
archive_command = 'pgbackrest --stanza=aiku archive-push %p'

# --- make lock waits and abandoned transactions visible (INI-140, 26 Oct 2026) ---
# On 26 Oct the default queue nearly stopped for 70 min and the Postgres log had
# nothing to say: lock waits were not logged and an idle transaction could hold
# a lock forever. Set with ALTER SYSTEM + pg_reload_conf (no restart needed).
log_lock_waits = on
idle_in_transaction_session_timeout = 10min

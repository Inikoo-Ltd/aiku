# WAL/standby tuning for helio (streaming replica of boro + Horizon worker
# host, 61GB RAM, 16 cores). Applied live via ALTER SYSTEM on 13 Aug 2026 —
# running values live in postgresql.auto.conf, WHICH OVERRIDES THIS FILE. This
# copy exists so a rebuild restores them; keep in sync when changing values.
# Place at /etc/postgresql/18/main/conf.d/99-helio-replica.conf

# --- fewer restartpoints, faster WAL replay (mirrors boro) ---
max_wal_size = 32GB
checkpoint_timeout = 30min

# --- standby query-vs-replay trade, set by Raul (pre-existing, documented here) ---
# hot_standby_feedback=on stops boro vacuuming rows helio queries still need
# (job cancellations were a real problem), at the cost of primary-side freeze
# debt — the weekly pg-freeze-sweep cron on boro is the counterweight.
# max_standby_streaming_delay=40s lets replay pause for slow hydrator queries;
# replay lag while boro-side backfills run is the accepted cost. Revisit both
# after email retention shortens the offending queries.
hot_standby_feedback = on
max_standby_streaming_delay = 40s
max_standby_archive_delay = 40s

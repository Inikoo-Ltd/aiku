# /etc/ssh/sshd_config.d/10-hardening.conf: the same settings boro, litio and helio got on 19 Oct 2026.
# Key-only login; per-source limit so one bot holding connections cannot throttle everyone else.
PasswordAuthentication no
PermitRootLogin prohibit-password
PerSourceMaxStartups 3
MaxStartups 50:30:200

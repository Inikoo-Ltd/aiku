# HAProxy on the calls box (INI-444): owns TCP 443 and splits it by SNI.
#   {{CALLS_DOMAIN}} -> LiveKit signalling, plain HTTP/WebSocket on 127.0.0.1:7880
#   {{TURN_DOMAIN}}  -> LiveKit TURN, plain TCP on 127.0.0.1:5349 with a PROXY v2 header
# TLS ends here with one Let's Encrypt certificate for both names (certbot, see README.md step 10).
# Install: sed the two domains into /etc/haproxy/haproxy.cfg (README step 11), then `haproxy -c -f /etc/haproxy/haproxy.cfg`.

global
    log /dev/log local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 4000
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend calls_443
    bind :::443 v4v6 ssl crt /etc/haproxy/certs/calls.pem
    use_backend livekit_turn if { ssl_fc_sni -i {{TURN_DOMAIN}} }
    default_backend livekit_signal

backend livekit_signal
    server livekit 127.0.0.1:7880

backend livekit_turn
    server livekit 127.0.0.1:5349 send-proxy-v2

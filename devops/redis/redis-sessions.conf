bind 127.0.0.1 10.0.0.3
port 6381
protected-mode no
tcp-keepalive 300
timeout 0
daemonize no
supervised systemd
pidfile /run/redis-sessions/redis-server.pid
logfile /var/log/redis/redis-server-sessions.log
databases 1
dir /var/lib/redis/sessions
dbfilename sessions.rdb
save 900 1 300 10 60 10000
stop-writes-on-bgsave-error no
appendonly yes
appendfsync everysec
maxmemory 8gb
maxmemory-policy volatile-lru

# litio = the web edge. Port 80 dispatches by hostname: Aurora, the parked Aurora shops, inikoo,
# shipping and soketi go to their own backends; everything else goes to 127.0.0.1:8079, which is
# boro's aiku frontend copied verbatim (PROXY protocol keeps the client IP). Keep that frontend and
# its backends in step with haproxy.cfg (boro), which stays the hot standby edge.
global
    hard-stop-after 1h
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
	errorfile 400 /etc/haproxy/errors-aiku/400.http
	errorfile 403 /etc/haproxy/errors-aiku/403.http
	errorfile 408 /etc/haproxy/errors-aiku/408.http
	errorfile 500 /etc/haproxy/errors-aiku/500.http
	errorfile 502 /etc/haproxy/errors-aiku/502.http
	errorfile 503 /etc/haproxy/errors-aiku/503.http
	errorfile 504 /etc/haproxy/errors-aiku/504.http

    # Common X-Forwarded-For handling for all HTTP proxies
    option  forwardfor           # preferred, adds/updates X-Forwarded-For safely
    # If you truly need a custom header rule instead of the option, you can use:
    # http-request set-header X-Forwarded-For %[src]


# aiku edge, same rules as boro; reached only through frontend www below (PROXY protocol keeps the client IP)
frontend aiku
    bind 127.0.0.1:8079 accept-proxy
    capture request header Host len 80

    # --- CLOUDFLARE REAL IP LOGIC START ---
    # Ensure /path/to/CF_ips.lst exists and contains Cloudflare's IP ranges
    acl from_cf src -f /etc/haproxy/CF_ips.lst
    acl cf_ip_hdr req.hdr(CF-Connecting-IP) -m found

    # Overwrite X-Forwarded-For with the real IP if the request is from Cloudflare
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)] if from_cf cf_ip_hdr
    # --- CLOUDFLARE REAL IP LOGIC END ---

    http-request set-src hdr_ip(CF-Connecting-IP) if from_cf

    # Blocks below this line see the real client IP
    # Banned IPs and ranges live only on the box, never in the repo: one per line in /etc/haproxy/banned-ips.lst
    acl scraper_ip src -f /etc/haproxy/banned-ips.lst
    http-request deny deny_status 403 if scraper_ip

    acl has_query query -m found
    http-request redirect code 301 location %[path,regsub(basket\.sys$,app/basket)]?%[query] if { path_end basket.sys } has_query
    http-request redirect code 301 location %[path,regsub(basket\.sys$,app/basket)] if { path_end basket.sys } !has_query
    http-request redirect code 301 location %[path,regsub(login\.sys$,app/login)]?%[query] if { path_end login.sys } has_query
    http-request redirect code 301 location %[path,regsub(login\.sys$,app/login)] if { path_end login.sys } !has_query
    http-request redirect code 301 location %[path,regsub(register\.sys$,app/register)]?%[query] if { path_end register.sys } has_query
    http-request redirect code 301 location %[path,regsub(register\.sys$,app/register)] if { path_end register.sys } !has_query
    http-request redirect code 301 location / if { path -i /index.php }

    # Deny any request targeting a PHP file (case-insensitive), regardless of path; returns 422
    # Exception: allow /unsubscribe.php to pass (handled below)
    acl deny_php path_reg -i \.php(\?.*)?$
    acl deny_php path_reg -i \.(config|cfg|conf|ini|yml|yaml|log|sh|bash|pl|py|sql|git|svn|bak|backup|old|one|~|htaccess|htpasswd|ashx|asp|aspx|jsp|exe|bat|cmd|ps1|dll|so|dylib|lock|sys)$
    acl deny_php path_sub -i zb_users

    acl deny_php path_beg -i /wp-admin /wp-content /wp-includes /wp-json /statics /readme.html /license.txt /trackback/ /phpmyadmin /config/ /server/ /admin/ /core/ /api/keys/ /system/ /bower_components /laravel /aws/s3

    acl sensitive_hidden path_reg -i (^|/)\.(env|git|svn|hg)([./-]|$)
    acl sensitive_backup path_reg -i (\.bak|\.old|\.save|\.swp|~)$
    acl sensitive_tools path_reg -i (^|/)(artisan|composer\.(json|lock))$

    http-request deny deny_status 403 if sensitive_hidden
    http-request deny deny_status 403 if sensitive_backup
    http-request deny deny_status 403 if sensitive_tools


    acl is_not_found path_reg -i ads\.txt$
    acl is_not_found path_reg -i meta\.json$

    acl is_not_found path_reg -i ^/?rwi/[0-9]+x[0-9]+_[0-9]+\.jpeg$
    http-request deny deny_status 404 if is_not_found    


    acl facebook_bot hdr_reg(User-Agent) -i (facebookexternalhit|meta-externalagent|meta-externalfetcher|facebookcatalog|meta-webindexer)
    acl meta_ip src -f /etc/haproxy/facebook-bots.lst

    acl is_meta_webhook path_beg -i /webhooks/whatsapp

    http-request deny deny_status 403 if facebook_bot !is_meta_webhook
    http-request deny deny_status 403 if meta_ip !is_meta_webhook

    acl allow_unsubscribe_php path_beg -i /unsubscribe.php
    http-request deny deny_status 422 if deny_php !allow_unsubscribe_php
    #http-request deny if facebook_bot


    http-request redirect prefix http://www.awartisan.eu code 301 if { hdr(host) -i awartisan.eu }
    http-request redirect prefix http://www.awartisan.pt code 301 if { hdr(host) -i awartisan.pt }
    http-request redirect prefix http://www.awartisan.de code 301 if { hdr(host) -i awartisan.de }
    http-request redirect prefix http://www.awartisan.fr code 301 if { hdr(host) -i awartisan.fr }
    http-request redirect prefix http://www.awartisan.es code 301 if { hdr(host) -i awartisan.es }

    acl is_canary hdr_beg(host) -i canary.
    acl is_sandbox hdr(host),lower,field(1,:) -m end aiku-sandbox.uk
    use_backend staging if is_canary or is_sandbox

    acl is_litio path_beg /devops/server/litio
    use_backend litio if is_litio
    acl is_helio path_beg /devops/server/helio
    use_backend helio if is_helio
    acl is_boro path_beg /devops/server/boro
    use_backend http_back if is_boro

    # Shopify stock feed only: litio Octane pool reading litio's DB replica (same block on boro+litio; falls back to http_back servers)
    acl is_replica_safe method GET
    acl is_replica_safe_path path_reg -i ^/webhooks/shopify/[^/]+/fetch_stock\.json$
    use_backend octane_replica if is_replica_safe is_replica_safe_path

    # Matches aiku.io and any subdomain, ignoring a port if present
    acl is_aiku hdr(host),lower,field(1,:) -m end aiku.io
    acl is_media hdr(host),lower,field(1,:) -m str media.aiku.io
    use_backend media_local if is_media
    use_backend http_back if is_aiku
    

    # Serve static assets directly from app servers (bypass Varnish)
    acl is_static path_reg -i \.(7z|avi|avif|bmp|bz2|css|csv|doc|docx|eot|flac|flv|gif|gz|ico|jpeg|jpg|js|mjs|map|less|mka|mkv|mov|mp3|mp4|mpeg|mpg|odt|otf|ogg|ogm|opus|pdf|png|ppt|pptx|rar|rtf|svg|svgz|swf|tar|tbz|tgz|ttf|txt|txz|wav|webm|webp|woff|woff2|xls|xlsx|xml|xz|zip)(\?.*)?$
    use_backend http_back if is_static

    # Route Echo/Laravel broadcasting auth directly to app backend (bypass Varnish)
    acl is_broadcast_auth path_beg -i /broadcasting/auth
    use_backend http_back if is_broadcast_auth

    # Route selected app paths directly to app backend (bypass Varnish)
    acl is_direct_app_paths path_beg -i /app /json /search /disclosure /unsubscribe /unsubscribe.php /locale /models /catalogue /invoice /attachment /webhooks
    use_backend http_back if is_direct_app_paths


    acl is_not_get method !GET
    use_backend http_back if is_not_get 

    acl is_v2_subdomain hdr(host) -m beg v2.
    use_backend varnish_helio  if is_v2_subdomain



#    default_backend http_back
    default_backend varnish
		


backend octane_replica
    balance leastconn
    http-response del-header Server
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host app.aiku.io
    option http-keep-alive
    http-reuse safe
    server litio_replica 10.0.0.1:8091 check maxconn 200
    server boro 10.0.0.3:8080 check maxconn 2500 backup
    server litio 10.0.0.1:8090 check maxconn 2500 backup

backend http_back
    # Load Balance Method (roundrobin, leastconn, source, random)
    balance roundrobin

    # Persistence Connection
    # stick-table type ip size 1m expire 30m
    # stick on src

    # Remove Header Server
    http-response del-header Server

    # Health Check
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host app.aiku.io
    #option http-server-close
    #option http-keep-alive
    option http-keep-alive
    http-reuse safe

    # Backend server pool
    server boro 10.0.0.3:8080 check maxconn 2500 weight 20
    server litio 10.0.0.1:8090 check maxconn 2500 weight 80


backend varnish
    server litio 127.0.0.1:6081

backend varnish_helio
    server litio 127.0.0.1:6081

backend staging
    server helio 10.0.0.2:8080

backend  boro
    server boro 10.0.0.3:8080
backend  helio
    server helio 10.0.0.2:8080
backend  litio
    server litio 10.0.0.1:8080

defaults
    maxconn 5000
    fullconn 5000
    retries 10
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 30s
    timeout client  30s
    timeout server  30s
    http-reuse always
    option  http-server-close
    option  http-keep-alive
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Enable HAProxy Cache 128MB of RAM
cache haproxy-cache
    total-max-size 128
    max-age 60m
    max-object-size 1000000
    process-vary off


# Enable HAProxy Statistics
listen stats
    bind 127.0.0.1:8880
    stats enable
    stats uri /
    stats realm Haproxy\ Statistics
    stats auth "${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}"
    stats refresh 15s



frontend www
    bind *:80
    mode http
    capture request header Host len 80
    timeout client 50s
    tcp-request inspect-delay 5s
    maxconn 75000

    acl cloudflare_valid_ip src -f /etc/haproxy/CF_ips.lst

    acl soketi hdr(host) -i soketi.aiku.io
    acl aiku hdr(host) -i shipping_test.inikoo.com shipping.inikoo.com
    acl inikoo hdr(host) -i box.inikoo.com www.inikoo.com
    acl aurora hdr_end(host) -i aurora.systems
    acl zombie hdr(host) -i www.agnesandcat.eu agnesandcat.eu www.aw-indonesia.com aw-indonesia.com
    acl bg path /email_tracker.php /reset.php /unsubscribe.php

    http-request deny if !cloudflare_valid_ip aiku or !cloudflare_valid_ip inikoo or !cloudflare_valid_ip aurora or !cloudflare_valid_ip zombie

    use_backend soketi if soketi
    use_backend aiku if aiku
    use_backend bg if bg aurora or bg zombie or bg inikoo
    use_backend inikoo if inikoo
    use_backend aurora if aurora
    use_backend varnish_nodes if zombie
    default_backend aiku_edge

backend aiku_edge
    timeout server 50s
    server local 127.0.0.1:8079 send-proxy-v2

backend varnish_nodes
    option forwardfor
    http-request set-header X-Forwarded-For %[src]
    compression algo gzip
    compression type text/html text/plain application/xml text/css text/js text/xml application/x-javascript text/javascript application/json application/xml+rss
    mode http
    balance uri whole
    hash-type consistent
#    option forwardfor
#    option http-server-close

    server litio 10.0.0.1:8080 check   maxconn 500 id 1 weight 1
#    server osmio 10.0.0.3:6081 check   maxconn 500 id 3 weight 1


   tcp-request inspect-delay 5s

backend inikoo       
    option forwardfor
    http-request set-header X-Forwarded-For %[src]
    compression algo gzip
    compression type text/html text/plain application/xml text/css text/js text/xml application/x-javascript text/javascript application/json application/xml+rss
    mode http
    balance roundrobin

    # Health Check
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host localhost
    option http-server-close
    option http-keep-alive

  
  #  server argon 10.0.0.1:8080 check  maxconn 500
    server litio 10.0.0.1:8080 check   maxconn 500 
#    server neon  10.0.0.3:8080 check   maxconn 500

   #tcp-request inspect-delay 5s




backend aiku
    option forwardfor
    http-request set-header X-Forwarded-For %[src]
    compression algo gzip
    compression type text/html text/plain application/xml text/css text/js text/xml application/x-javascript text/javascript application/json application/xml+rss
    mode http
    balance roundrobin


    # Health Check
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host localhost
    option http-server-close
    option http-keep-alive

    # Enable cache lookup for backend
    http-request cache-use haproxy-cache
    http-response cache-store haproxy-cache

    server litio  10.0.0.1:8881 check   maxconn 500
    #server osmio  10.0.0.3:8881 check   maxconn 500
    tcp-request inspect-delay 5s



backend aurora
    option forwardfor
    http-request set-header X-Forwarded-For %[src]
    compression algo gzip
    compression type text/html text/plain application/xml text/css text/js text/xml application/x-javascript text/javascript application/json application/xml+rss
    timeout tunnel 1h
    mode http
    balance roundrobin

    # Health Check
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host localhost
    option http-server-close
    option http-keep-alive

    # Enable cache lookup for backend
    http-request cache-use haproxy-cache
    http-response cache-store haproxy-cache

    #server osmio 10.0.0.3:8080 check   maxconn 500  weight 5
    server litio  10.0.0.1:8080 check   maxconn 500 weight 95

   tcp-request inspect-delay 5s





backend bg
    option forwardfor
    http-request set-header X-Forwarded-For %[src]
    compression algo gzip
    compression type text/html text/plain application/xml text/css text/js text/xml application/x-javascript text/javascript application/json application/xml+rss
    mode http
    balance roundrobin
    

    # Health Check
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host localhost
    option http-server-close
    option http-keep-alive

    # Enable cache lookup for backend
    http-request cache-use haproxy-cache
    http-response cache-store haproxy-cache


#    server osmio 10.0.0.3:8080 check maxconn 500 weight 70
    server litio 10.0.0.1:8080 check maxconn 500 weight 30

   tcp-request inspect-delay 5s





backend soketi
    mode http
    timeout tunnel 1h
    server soketi 127.0.0.1:6002 check

backend media_local
    server litio 127.0.0.1:8094 check
